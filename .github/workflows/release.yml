name: Build & Release Plasmoid

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
          python3 -m pip install PySide6

      - name: Run Test Suite
        run: |
          python3 -m unittest discover tests

      - name: Build Plasmoid Packages
        run: |
          ./scripts/package.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/com.github.khoipm06.panelscroller.plasmoid
            build/com.github.khoipm06.panelscroller-*.plasmoid
          generate_release_notes: true
